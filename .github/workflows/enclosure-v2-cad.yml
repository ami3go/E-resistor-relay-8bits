name: Build E-resistor enclosure V2 CAD

on:
  push:
    branches: [main]
    paths:
      - "enclosure/V2/create_v2.py"
      - "enclosure/V2/render_cpu.py"
      - ".github/workflows/enclosure-v2-cad.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies and font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install cadquery trimesh numpy pillow
      - name: Export V2 BRep STEP and STL and verify manifold geometry
        run: python enclosure/V2/create_v2.py
      - name: Render CAD-based assembled exploded and stacked views
        run: python enclosure/V2/render_cpu.py
      - name: Check generated files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("enclosure/V2")
          for n in ("chassis_v2.stl","chassis_v2.step","module_reference.step",
                    "two_modules_reference.step","exploded_reference.step",
                    "assembled_v2.png","exploded_v2.png","stacked_v2.png","verification.json"):
              p=root/n
              assert p.is_file() and p.stat().st_size>100, f"Missing/empty: {p}"
          d=json.loads((root/"verification.json").read_text())
          assert d["BRep_valid"] and d["STL_watertight"]
          assert d["BRep_solids"]==1 and d["STL_connected_parts"]==1
          assert d["required_printed_parts_per_level"]==1
          assert 5<=d["lower_clearance_nominal_mm"]<=10
          print("V2 STL, STEP, visualizations and mesh verification OK")
          PY
      - name: Commit versioned V2 CAD exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f enclosure/V2/chassis_v2.stl \
            enclosure/V2/chassis_v2.step \
            enclosure/V2/module_reference.step \
            enclosure/V2/two_modules_reference.step \
            enclosure/V2/exploded_reference.step \
            enclosure/V2/assembled_v2.png \
            enclosure/V2/exploded_v2.png \
            enclosure/V2/stacked_v2.png \
            enclosure/V2/verification.json
          if git diff --cached --quiet; then
            echo "CAD exports unchanged"
          else
            git commit -m "Generate verified V2 monolithic enclosure STL STEP and assembly views"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
